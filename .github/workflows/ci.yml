name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

# Cancela execuções anteriores do mesmo branch quando um novo push chega
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, Typecheck & Testes
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Lint (ESLint / Expo)
        run: npm run lint

      - name: Testes (Jest) + cobertura
        run: npm run test:coverage

      - name: Publicar relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ./coverage
          retention-days: 7

      - name: Expo Doctor (diagnóstico de dependências)
        run: npx --yes expo-doctor@latest

  build-preview:
    name: EAS Build (preview)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: quality
    # O contexto `secrets` NÃO é permitido em jobs.<job_id>.if (só github, needs,
    # vars e inputs). Por isso o gate usa a repository variable EAS_BUILD_ENABLED
    # e o token é injetado via env no step.
    if: ${{ vars.EAS_BUILD_ENABLED == 'true' }}
    # evita builds duplicados a cada push enquanto um anterior está em andamento
    concurrency:
      group: eas-build-preview
      cancel-in-progress: false

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: EAS Build (preview • Android APK • distribuição interna)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN nao configurado. Adicione o secret em Settings > Secrets and variables > Actions."
            exit 1
          fi
          npx eas-cli@latest build --profile preview --platform android --non-interactive
